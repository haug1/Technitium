name: Windows manifest tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manifest-validation:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          path: DnsServer
      - uses: actions/checkout@v7
        with:
          repository: TechnitiumSoftware/TechnitiumLibrary
          ref: 4a5a530ac6c4114e72216e0b9c74208a7a5e3fa0
          path: TechnitiumLibrary
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build TechnitiumLibrary
        working-directory: TechnitiumLibrary
        shell: bash
        run: |
          for project in TechnitiumLibrary.ByteTree TechnitiumLibrary.Net TechnitiumLibrary.Security.OTP; do
            dotnet build "$project/$project.csproj" -c Release
          done
      - name: Run manifest validation tests on Windows
        working-directory: DnsServer
        run: dotnet test DnsServerCore.Tests/DnsServerCore.Tests.csproj --filter FullyQualifiedName~ConfigurationManifestTests
      - name: Validate the minimal manifest through the console host
        working-directory: DnsServer
        run: dotnet run --no-build --project DnsServerApp/DnsServerApp.csproj -- config validate configuration/examples/minimal.json
      - name: Build the Windows firewall library with Visual Studio MSBuild
        working-directory: TechnitiumLibrary
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $msbuild = & $vswhere -latest -products '*' -requires Microsoft.Component.MSBuild -find 'MSBuild\Current\Bin\amd64\MSBuild.exe'
          if (!$msbuild) { throw 'Visual Studio MSBuild was not found.' }
          & $msbuild TechnitiumLibrary.Net.Firewall/TechnitiumLibrary.Net.Firewall.csproj -restore -p:Configuration=Release
      - name: Build the Windows service host
        working-directory: DnsServer
        run: dotnet build DnsServerWindowsService/DnsServerWindowsService.csproj
      - name: Verify console and Windows service startup
        working-directory: DnsServer
        shell: pwsh
        run: ./DnsServerCore.Tests/windows_manifest_startup.ps1
